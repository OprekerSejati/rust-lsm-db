[package]
name = "lsm-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.5.1"
crossbeam-skiplist = "0.1.3"
fastbloom = "0.17.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
criterion = "0.8"
tempfile = "3.27.0"

[[bench]]
name = "engine_bench"
harness = false

[[bench]]
name = "scaling"
harness = false
